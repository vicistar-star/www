name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The serverless smoke tests serve the built `dist/` output, so the full
      # suite only runs against a fresh build.
      - run: pnpm build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high production dependency advisories
        run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint:i18n
      - run: pnpm validate:content
      - run: pnpm test:a11y
      - run: pnpm build
      - run: pnpm validate:jsonld

      - name: Ensure Playwright reports are not tracked
        run: |
          if git ls-files --error-unmatch 'playwright-report/**' >/dev/null 2>&1; then
            echo "::error::Generated Playwright reports must not be committed."
            exit 1
          fi

  serverless-smoke:
    name: Serverless Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Smoke test the serverless routes
        run: pnpm test:smoke

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:link-check
      - run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check links in the build
        run: pnpm check:links --report link-check-report.json

      - name: Upload link check report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-report.json
          if-no-files-found: ignore
          retention-days: 14

  playwright-a11y:
    name: Playwright A11y Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright a11y tests
        run: pnpm test:a11y:playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start preview server
        run: pnpm preview --host &
      - name: Wait for preview server
        run: npx --yes wait-on tcp:localhost:4173 --timeout 30000

      - name: Run Lighthouse on Mobile
        id: lighthouse_mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.github/lhci-mobile.json'

      - name: Save Mobile Reports
        if: always()
        run: cp -r .lighthouseci .lighthouseci-mobile

      - name: Run Lighthouse on Desktop
        id: lighthouse_desktop
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.github/lhci-desktop.json'

      - name: Save Desktop Reports
        if: always()
        run: cp -r .lighthouseci .lighthouseci-desktop

      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci-mobile/
            .lighthouseci-desktop/
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Comment on PR
        uses: actions/github-script@v7
        if: >-
          github.event_name == 'pull_request' &&
          (steps.lighthouse_mobile.outcome == 'success' || steps.lighthouse_mobile.outcome == 'failure') &&
          (steps.lighthouse_desktop.outcome == 'success' || steps.lighthouse_desktop.outcome == 'failure')
        env:
          MOBILE_LINKS: ${{ steps.lighthouse_mobile.outputs.links }}
          DESKTOP_LINKS: ${{ steps.lighthouse_desktop.outputs.links }}
        with:
          script: |
            const fs = require('fs');
            const mobileManifest = JSON.parse(fs.readFileSync('.lighthouseci-mobile/manifest.json', 'utf8'));
            const desktopManifest = JSON.parse(fs.readFileSync('.lighthouseci-desktop/manifest.json', 'utf8'));

            const mobile = mobileManifest[0];
            const desktop = desktopManifest[0];

            // Thresholds must stay in sync with lhci-mobile.json / lhci-desktop.json
            const PERF_BUDGET = 80;
            const BUDGET = 95;
            const formatScore = (val) => Math.round(val * 100);

            const mobilePerf = formatScore(mobile.summary.performance);
            const mobileA11y = formatScore(mobile.summary.accessibility);
            const mobileBp = formatScore(mobile.summary['best-practices']);
            const mobileSeo = formatScore(mobile.summary.seo);

            const desktopPerf = formatScore(desktop.summary.performance);
            const desktopA11y = formatScore(desktop.summary.accessibility);
            const desktopBp = formatScore(desktop.summary['best-practices']);
            const desktopSeo = formatScore(desktop.summary.seo);

            const allPass =
              mobilePerf >= PERF_BUDGET && desktopPerf >= PERF_BUDGET &&
              [mobileA11y, mobileBp, mobileSeo, desktopA11y, desktopBp, desktopSeo]
                .every(s => s >= BUDGET);

            const getPerfEmoji = (score) => {
              if (score >= PERF_BUDGET) return '🟢';
              if (score >= 70) return '🟡';
              return '🔴';
            };
            const getScoreEmoji = (score) => {
              if (score >= BUDGET) return '🟢';
              if (score >= 90) return '🟡';
              return '🔴';
            };

            const mobileLinks = JSON.parse(process.env.MOBILE_LINKS || '{}');
            const desktopLinks = JSON.parse(process.env.DESKTOP_LINKS || '{}');
            const mobileReport = mobileLinks['http://localhost:4173/'] || '';
            const desktopReport = desktopLinks['http://localhost:4173/'] || '';

            const reportLinks = [];
            if (mobileReport) reportLinks.push(`[Mobile Report](${mobileReport})`);
            if (desktopReport) reportLinks.push(`[Desktop Report](${desktopReport})`);
            const reportText = reportLinks.length > 0 ? `📄 **Reports:** ${reportLinks.join(' | ')}` : '';

            const statusLine = allPass
              ? '✅ All categories meet their CI budgets.'
              : '❌ One or more categories are below their CI budget — this job will block merge.';

            const body = `### ⚡ Lighthouse Audit Results

            ${statusLine}

            | Category | Mobile | Desktop | CI Budget |
            | --- | --- | --- | --- |
            | **Performance** | ${getPerfEmoji(mobilePerf)} **${mobilePerf}** | ${getPerfEmoji(desktopPerf)} **${desktopPerf}** | ≥ 80 _(CI runner)_ |
            | **Accessibility** | ${getScoreEmoji(mobileA11y)} **${mobileA11y}** | ${getScoreEmoji(desktopA11y)} **${desktopA11y}** | ≥ 95 |
            | **Best Practices** | ${getScoreEmoji(mobileBp)} **${mobileBp}** | ${getScoreEmoji(desktopBp)} **${desktopBp}** | ≥ 95 |
            | **SEO** | ${getScoreEmoji(mobileSeo)} **${mobileSeo}** | ${getScoreEmoji(desktopSeo)} **${desktopSeo}** | ≥ 95 |

            ${reportText}

            > Performance budget is set to ≥ 80 in CI due to GitHub-hosted runner variance. Accessibility, Best Practices, and SEO are held to ≥ 95.

            *Full reports are also saved as the \`lighthouse-reports\` workflow artifact.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
