name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The serverless smoke tests serve the built `dist/` output, so the full
      # suite only runs against a fresh build.
      - run: pnpm build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high production dependency advisories
        run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint:i18n
      - run: pnpm validate:content
      - run: pnpm test:a11y
      - run: pnpm build
      - run: pnpm validate:jsonld

      - name: Ensure Playwright reports are not tracked
        run: |
          if git ls-files --error-unmatch 'playwright-report/**' >/dev/null 2>&1; then
            echo "::error::Generated Playwright reports must not be committed."
            exit 1
          fi

  serverless-smoke:
    name: Serverless Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Smoke test the serverless routes
        run: pnpm test:smoke

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:link-check
      - run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check links in the build
        run: pnpm check:links --report link-check-report.json

      - name: Upload link check report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-report.json
          if-no-files-found: ignore
          retention-days: 14

  playwright-a11y:
    name: Playwright A11y Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright a11y tests
        run: pnpm test:a11y:playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start preview server
        run: pnpm preview --host &
      - name: Wait for preview server
        run: npx --yes wait-on tcp:localhost:4173 --timeout 30000

      - name: Run Lighthouse on Mobile
        id: lighthouse_mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.github/lhci-mobile.json'

      - name: Save Mobile Reports
        if: always()
        run: cp -r .lighthouseci .lighthouseci-mobile

      - name: Run Lighthouse on Desktop
        id: lighthouse_desktop
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.github/lhci-desktop.json'

      - name: Save Desktop Reports
        if: always()
        run: cp -r .lighthouseci .lighthouseci-desktop

      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci-mobile/
            .lighthouseci-desktop/
          if-no-files-found: ignore
          retention-days: 14

      - name: Post Comment on PR
        continue-on-error: true
        uses: actions/github-script@v7
        if: >-
          github.event_name == 'pull_request' &&
          (steps.lighthouse_mobile.outcome == 'success' || steps.lighthouse_mobile.outcome == 'failure') &&
          (steps.lighthouse_desktop.outcome == 'success' || steps.lighthouse_desktop.outcome == 'failure')
        with:
          script: |
            const fs = require('fs');
            const mobileManifest = JSON.parse(fs.readFileSync('.lighthouseci-mobile/manifest.json', 'utf8'));
            const desktopManifest = JSON.parse(fs.readFileSync('.lighthouseci-desktop/manifest.json', 'utf8'));

            const snap = JSON.parse(fs.readFileSync('scripts/routes-snapshot.json', 'utf8'));
            const base = 'http://localhost:4173';

            // Thresholds must stay in sync with lhci-mobile.json / lhci-desktop.json.
            // Performance is not gated in CI due to GitHub-hosted runner variance.
            const BUDGET = 95;
            const formatScore = (val) => Math.round(val * 100);
            const getPerfEmoji = (score) => {
              if (score >= 90) return '🟢';
              if (score >= 70) return '🟡';
              return '🔴';
            };
            const getScoreEmoji = (score) => {
              if (score >= BUDGET) return '🟢';
              if (score >= 90) return '🟡';
              return '🔴';
            };

            // Build one row per audited route
            const rows = snap.lighthouseRoutes.map(r => {
              const url = base + r.path;
              const mob = mobileManifest.find(m => m.url === url);
              const desk = desktopManifest.find(d => d.url === url);
              if (!mob || !desk) return null;
              const mp = formatScore(mob.summary.performance);
              const ma = formatScore(mob.summary.accessibility);
              const mb = formatScore(mob.summary['best-practices']);
              const ms = formatScore(mob.summary.seo);
              const dp = formatScore(desk.summary.performance);
              const da = formatScore(desk.summary.accessibility);
              const db = formatScore(desk.summary['best-practices']);
              const ds = formatScore(desk.summary.seo);
              return `| \`${r.path}\` | ${getPerfEmoji(mp)} **${mp}** / ${getScoreEmoji(ma)} **${ma}** / ${getScoreEmoji(mb)} **${mb}** / ${getScoreEmoji(ms)} **${ms}** | ${getPerfEmoji(dp)} **${dp}** / ${getScoreEmoji(da)} **${da}** / ${getScoreEmoji(db)} **${db}** / ${getScoreEmoji(ds)} **${ds}** |`;
            }).filter(Boolean).join('\n');

            const allA11yBpSeo = [...mobileManifest, ...desktopManifest].every(m =>
              formatScore(m.summary.accessibility) >= BUDGET &&
              formatScore(m.summary['best-practices']) >= BUDGET &&
              formatScore(m.summary.seo) >= BUDGET
            );

            const statusLine = allA11yBpSeo
              ? '✅ Accessibility, Best Practices, and SEO meet the ≥ 95 budget across all audited routes.'
              : '❌ One or more gated categories are below 95 — this job will block merge.';

            const body = `### ⚡ Lighthouse Audit Results

            ${statusLine}

            | Route | Mobile Perf / A11y / BP / SEO | Desktop Perf / A11y / BP / SEO |
            | --- | --- | --- |
            ${rows}

            > Performance is not gated in CI — GitHub-hosted runner scores vary ±20 pts. Full reports are saved as the \`lighthouse-reports\` artifact for manual review.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
