name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The serverless smoke tests serve the built `dist/` output, so the full
      # suite only runs against a fresh build.
      - run: pnpm build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high production dependency advisories
        run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint:i18n
      - run: pnpm validate:content
      - run: pnpm test:a11y
      - run: pnpm build
      - run: pnpm validate:jsonld

      - name: Ensure Playwright reports are not tracked
        run: |
          if git ls-files --error-unmatch 'playwright-report/**' >/dev/null 2>&1; then
            echo "::error::Generated Playwright reports must not be committed."
            exit 1
          fi

  serverless-smoke:
    name: Serverless Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Smoke test the serverless routes
        run: pnpm test:smoke

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:link-check
      - run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check links in the build
        run: pnpm check:links --report link-check-report.json

      - name: Upload link check report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-report.json
          if-no-files-found: ignore
          retention-days: 14

  playwright-a11y:
    name: Playwright A11y Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright a11y tests
        run: pnpm test:a11y:playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Generate Lighthouse URL list from route inventory
        run: |
          node -e "
            const snap = JSON.parse(require('fs').readFileSync('scripts/routes-snapshot.json','utf8'));
            const base = 'http://localhost:4173';
            const urls = snap.lighthouseRoutes.map(r => base + r.path).join('\n');
            require('fs').writeFileSync('.github/lighthouse-urls.txt', urls + '\n');
            console.log('Lighthouse URLs:', urls);
          "

      - name: Run Lighthouse on Mobile
        id: lighthouse_mobile
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urlsFile: './.github/lighthouse-urls.txt'
          startServerCommand: pnpm preview
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Save Mobile Manifest
        if: steps.lighthouse_mobile.outcome == 'success'
        run: cp -r .lighthouseci .lighthouseci-mobile

      - name: Run Lighthouse on Desktop
        id: lighthouse_desktop
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urlsFile: './.github/lighthouse-urls.txt'
          startServerCommand: pnpm preview
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.github/lhci-desktop.json'

      - name: Save Desktop Manifest
        if: steps.lighthouse_desktop.outcome == 'success'
        run: cp -r .lighthouseci .lighthouseci-desktop

      - name: Post Comment on PR
        uses: actions/github-script@v7
        if: >-
          github.event_name == 'pull_request' &&
          steps.lighthouse_mobile.outcome == 'success' &&
          steps.lighthouse_desktop.outcome == 'success'
        env:
          MOBILE_LINKS: ${{ steps.lighthouse_mobile.outputs.links }}
          DESKTOP_LINKS: ${{ steps.lighthouse_desktop.outputs.links }}
        with:
          script: |
            const fs = require('fs');
            const mobileManifest = JSON.parse(fs.readFileSync('.lighthouseci-mobile/manifest.json', 'utf8'));
            const desktopManifest = JSON.parse(fs.readFileSync('.lighthouseci-desktop/manifest.json', 'utf8'));

            const snap = JSON.parse(fs.readFileSync('scripts/routes-snapshot.json', 'utf8'));
            const base = 'http://localhost:4173';

            const formatScore = (val) => Math.round(val * 100);
            const getScoreEmoji = (score) => {
              if (score >= 95) return '🟢';
              if (score >= 90) return '🟡';
              return '🔴';
            };

            const mobileLinks = JSON.parse(process.env.MOBILE_LINKS || '{}');
            const desktopLinks = JSON.parse(process.env.DESKTOP_LINKS || '{}');

            // Build one row per audited route
            const rows = snap.lighthouseRoutes.map(r => {
              const url = base + r.path;
              const mob = mobileManifest.find(m => m.url === url);
              const desk = desktopManifest.find(d => d.url === url);
              if (!mob || !desk) return null;
              const mp = formatScore(mob.summary.performance);
              const ma = formatScore(mob.summary.accessibility);
              const dp = formatScore(desk.summary.performance);
              const da = formatScore(desk.summary.accessibility);
              return `| \`${r.path}\` | ${getScoreEmoji(mp)} **${mp}** / ${getScoreEmoji(ma)} **${ma}** | ${getScoreEmoji(dp)} **${dp}** / ${getScoreEmoji(da)} **${da}** |`;
            }).filter(Boolean).join('\n');

            const reportLinks = [];
            for (const r of snap.lighthouseRoutes) {
              const url = base + r.path;
              if (mobileLinks[url]) reportLinks.push(`[Mobile ${r.path}](${mobileLinks[url]})`);
              if (desktopLinks[url]) reportLinks.push(`[Desktop ${r.path}](${desktopLinks[url]})`);
            }
            const reportText = reportLinks.length > 0
              ? `📄 **Reports:** ${reportLinks.join(' | ')}`
              : '';

            const body = `### ⚡ Lighthouse Audit Results

            | Route | Mobile Perf / A11y | Desktop Perf / A11y |
            | --- | --- | --- |
            ${rows}

            ${reportText}

            *Audit ran against the latest build on preview server.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
